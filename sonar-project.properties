# Must be unique in a given SonarQube instance
sonar.projectKey=mytranslator
sonar.projectName=MyTranslator
sonar.projectVersion=1.0

# Path to sources
# The value is comma-separated list of paths to directories containing source code
sonar.sources=.

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Exclude directories
sonar.exclusions=venv/**,.venv/**,tests/**,dist/**,build/**,*.spec

# Python specific
sonar.python.version=3.10, 3.11, 3.12
